;           ::::   AI   ::::
Brain_Start: 1				; (Padrão= 1) De=(1 a 60) Este número representa o foco inicial nesta conta.
Brain_Speed: 100			; (Padrão= 70) De=(1 a 100) Em tarefas generalizadas, leva menos tempo para executar as tarefas e reduz o processamento do programa.
Brain_Tork: 100				; (Padrão= 60) De=(1 a 100) Em tarefas específicas, leva menos tempo para executar tarefas pesadas e reduz o processamento do programa.
Brain_Verification: 1			; (Padrão= 98 ou 1) De=(1 a 100) Quanto mais, maior será a camada extra de verificação das acc, com mais camada extra de verificação visual, o programa se torna mais duvidoso ao exibir informações sobre o status do cliente e aumenta o processamento, mas mantém os clientes muito mais atualizados em termos de informações para as administrações do programa. Resumo: quanto maior o valor pior a visualização sua, mas melhora a visualização para o administrador e do cliente.
Brain_Ciclo: 60				; (Padrão= 4) De=(1 a 60) Verifique quantas contas o programa verificará antes de fazer uma breve pausa. Quanto menos o numero, menor será o uso máximo da CPU, mais tempo levará para gerenciar um grande número de clientes, e fazendo uma breve pausa após fazer o número que você inseriu.
Brain_Size: 99				; (Padrão= 95) De=(1 a 99) Alterna o programa entre dois sistemas: um é o sistema do usuário e o outro é o sistema de administração do cliente. Quanto maior o número, mais o programa se concentra no sistema do administrador.
Volume: 70000				; (Padrão= 70000) De=(1000 a 3600000) Tempo em segundos dividido entre os dois sistemas, administrador e usuário, quanto maior o "Brain_Size", maior a porcentagem desse tempo de "Volume" para o sistema gerenciar os clientes.
;           ::::  Login   ::::
EXE: "aurera_gl"			; (Padrão= aurera_gl) (aurera_gl ou aurera_dx) Nome base do arquivo exe do aurera, "gl" usa o sistema OpenGL como um vaso, "dx" usa o sistema DirectX, use o que for mais leve no seu computador. O programa atualiza o resto do nome do EXE automaticamente.
Tentativas: 999				; (Padrão= 4) De=(1 a 999) Número de tentativas ao efetuar login antes da acc entrar em pausa.
Force_Key: True				; (Padrão= True) (True ou False ou Press ou Paste) A opção False escreve rapido, True mais rapido ainda, Press sistema que simula o uso de teclas, Paste sistema que simula o recorta e cola, esses são os sistemas escrita usado para efetuar login do client.
Press_Key: 50				; (Padrão= 50) De=(10 a 500) Delay em mile segundos para precionar a próxima tecla caso coloque no Force_Key: Press
;           ::::  Preferencia   ::::
HotKey: True				; (Padrão= False) (True ou False) A opção True ativa o sistema de teclas de atalho, uma maneira adicional e mais rápida de interagir com clientes e com o administrador sem precisar visualizar nada. Para mais informações, consulte o arquivo Help.txt. Você pode mantê-lo desativado, pois pode usar o sistema de prompts para interagir com clientes e administradores. As teclas de atalho são mais adequadas para pessoas experientes com o administrador.
Force_CMD: False			; (Padrão= False) (True ou False) True ativa o sistema que aumenta a velocidade de absorção dos comandos do prompt do programa administrador, use False para desativá-lo, Gasto de CPU entre 0.1% a 0.2% podendo variar.
;           ::::   Tema   ::::
Tema_Black: True			; (Padrão= True) (True ou False) Altera o tema do programa para tema escuro, Falso mantém o tema padrão do Windows.
IMG_Background: "6"			; (Padrão= 6) Esse é o nome da foto que vai ser colocada ao fundo do ADM a imagem tem que ser sempre começar com "BG_" e terminar com o formato ".bmp", as fotos ficam na pasta Background.
BG_ON: True				; (Padrão= False) (True ou False) True ativa o sistema de background que coloca a foto IMG_Background no fundo do ADM.
;           ::::   Som   ::::
Beep: True				; (Padrão= True) (True ou False) True ativa o sistema que emite sons ao usar uma tecla de atalho ou algo muito específico, é recomendável mantê-lo ativado mesmo sem o sistema HotKey, como o HotKey está ativo ele pode ser utilizado mesmo com o programa minimizado, por isso é bom manter o beep ligado, confirmando assim o uso do HotKey. Use False para desativá-lo e não haverá som.
;           ::::  Log   ::::
Log: True				; (Padrão= True) (True ou False) True ativa o sistema de registro de logs do programa do administrador, use False para desativá-lo.
Opera: True				; (Padrão= True) (True ou False) True ativa o sistema de diagnostico do programa, ele ajuda a intificar erros caso aja em seu computador, use False para desativá-lo, esse sistema é muito mais leve e continuo que o sistema de Log padrão, Gasto de CPU entre 0.1% a 0.2% podendo variar.
